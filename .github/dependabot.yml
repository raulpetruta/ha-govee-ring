version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # bump by hand when the minimum Home Assistant version in hacs.json changes
      - dependency-name: pytest-homeassistant-custom-component
