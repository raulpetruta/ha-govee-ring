name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/govee_ring/manifest.json > m.json
          mv m.json custom_components/govee_ring/manifest.json
      - name: Build zip
        run: cd custom_components/govee_ring && zip -r "$GITHUB_WORKSPACE/govee_ring.zip" . -x '*__pycache__*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: govee_ring.zip
